[platformio]

boards_dir = rakwireless/boards


[env:rak11310]

platform = https://github.com/maxgerhardt/platform-raspberrypi

board_build.core = earlephilhower

board = rakwireless_rak11300

framework = arduino


build_flags =
    -D ARDUINO_RAKWIRELESS_RAK11300=1

    ; WisBlock GPIO definitions
    -I rakwireless/variants/rak11300

    -D WB_IO1=6
    -D WB_IO2=22
    -D WB_IO3=7
    -D WB_IO4=28
    -D WB_IO5=9
    -D WB_IO6=8

    -D WB_A0=26
    -D WB_A1=27

    ; LEDs
    -D PIN_LED1=23
    -D PIN_LED2=24
    -D LED_BUILTIN=23
    -D LED_CONN=24
    -D LED_GREEN=23
    -D LED_BLUE=24


monitor_speed = 115200