; ECE455 LoRa Swarm Data Logger
; Target node: RAK11310 (RP2040 + SX1262) on a RAK19001 WisBlock base.
;
; Pin map is provided by the earlephilhower "rakwireless_rak11300" variant:
;   Wire   -> i2c1  GP2 (SDA) / GP3 (SCL)   <- WisBlock base sensor slots (RAK1906 etc.)
;   Wire1  -> i2c0  GP20 / GP21             <- WisBlock IO slot
;   Serial1 -> UART0 GP0 (TX) / GP1 (RX)
;   Serial2 -> UART1 GP4 (TX) / GP5 (RX)    <- RS485 / weather station candidate
;   SPI1   -> hardwired to SX1262: SCK 10 / MOSI 11 / MISO 12 / NSS 13
;   SX1262 -> NRESET 14, BUSY 15, DIO1 29, ANT_PWR 25, TCXO on DIO3 @ 1.8V, DIO2 = RF switch

[platformio]
boards_dir = rakwireless/boards
default_envs = rak11310

[env:rak11310]
platform = https://github.com/maxgerhardt/platform-raspberrypi
board = rakwireless_rak11300
board_build.core = earlephilhower
framework = arduino

; Reserve 512 KB of the 2 MB flash for a LittleFS data log ring buffer.
board_build.filesystem_size = 0.5m

monitor_speed = 115200

lib_deps =
    jgromes/RadioLib @ ^7.1
    ; --- Phase 2 sensors ---
    adafruit/Adafruit BME680 Library @ ^2.0          ; RAK1906 / BME680
    adafruit/Adafruit Unified Sensor @ ^1.1
    sparkfun/SparkFun u-blox GNSS Arduino Library @ ^2.2  ; RAK12500 (ZOE-M8Q is an M8 -> v2, not v3)
    constiko/RTC RV-3028-C7 Arduino Library @ ^2.1    ; RAK12002 RTC
    paulstoffregen/OneWire @ ^2.3                     ; DS18B20 temperature string
    milesburton/DallasTemperature @ ^4.0
    envirodiy/SensorModbusMaster @ ^1.7              ; RS485 / Modbus sonde + weather station

build_flags =
    -D ARDUINO_RAKWIRELESS_RAK11300=1
    -I rakwireless/variants/rak11300

    ; ---- Status LEDs (RAK11310 on-module) ----
    -D PIN_LED1=23
    -D PIN_LED2=24
    -D LED_BUILTIN=23
    -D LED_GREEN=23
    -D LED_BLUE=24

    ; ---- WisBlock IO header (RP2040 GPIO). VERIFY against the RAK19001 schematic
    ;      before wiring the safety light / external peripherals. ----
    -D WB_IO1=6
    -D WB_IO2=22
    -D WB_IO3=7
    -D WB_IO4=28
    -D WB_IO5=9
    -D WB_IO6=8
    -D WB_A0=26
    -D WB_A1=27
